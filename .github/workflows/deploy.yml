name: Build & Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - feature/d1-migration-phase1
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build + Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate

      - name: Build Next.js
        run: npx next build --no-lint 2>&1 | tail -10

      - name: Build OpenNext bundle
        run: npx opennextjs-cloudflare build --skipNextBuild 2>&1 | tail -10

      - name: Validate sitemap config
        # Sanity check: confirm sitemap-related files exist and have consistent structure
        run: |
          set -e
          echo "=== Checking sitemap files exist ==="
          for f in src/lib/sitemap-helpers.ts \
                   src/lib/build-resources-sitemap.ts \
                   src/app/sitemap.xml/route.ts \
                   src/app/sitemap-static.xml/route.ts \
                   src/app/sitemap-classes.xml/route.ts \
                   src/app/sitemap-subjects.xml/route.ts \
                   src/app/sitemap-teachers.xml/route.ts \
                   src/app/sitemap-resources-1.xml/route.ts \
                   src/app/sitemap-resources-2.xml/route.ts \
                   src/app/sitemap-resources-3.xml/route.ts; do
            if [ ! -f "$f" ]; then
              echo "❌ MISSING: $f"
              exit 1
            fi
          done
          echo "✅ All 10 sitemap files present"

          # Check that all route.ts files use sitemapCacheHeaders
          echo ""
          echo "=== Checking cache headers ==="
          for f in src/app/sitemap*.xml/route.ts src/app/sitemap.xml/route.ts; do
            if ! grep -q "sitemapCacheHeaders" "$f"; then
              echo "❌ $f doesn't use sitemapCacheHeaders"
              exit 1
            fi
          done
          echo "✅ All 9 sitemaps use sitemapCacheHeaders (with stale-while-revalidate)"

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        run: |
          # Point wrangler to the correct worker entry point.
          # 2026-11-10: la prod pointait sur ".open-next/worker.js" (sed
          # récupéré d'une restauration de fichier post-filter-branch). Ce
          # worker n'exporte AUCUN handler `scheduled` => les triggers cron
          # enregistrés sur le script ("0 3 * * *", "*/5 * * * *") se
          # déclenchaient dans le vide : /api/cron/* n'a jamais tourné en
          # prod. worker-cron.js relaie fetch tel quel (sans le cache HTML
          # sans TTL) et restaure le handler scheduled + les métriques KV.
          sed 's|"main": "worker-with-cache.js"|"main": "worker-cron.js"|' \
            wrangler.prod.jsonc > wrangler.github.jsonc
          npx wrangler deploy --config wrangler.github.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Register deployment version
        if: github.ref == 'refs/heads/main'
        # Inscrit la version deployee dans le registre D1 `DeploymentVersion`
        # (numerotation 0.01, 0.02... +0.01 par deploiement de code).
        # Idempotent : un rerun de la CI ne cree pas de doublon.
        run: |
          node scripts/register-deployment.mjs --env=prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Smoke test prod (rendu à froid)
        if: github.ref == 'refs/heads/main'
        # 2026-11-15 : après le 7.05 (props fonction serveur→client ⇒ 500 sur
        # TOUTES les pages), le cache ISR a masqué le bug pendant ~7 h avant
        # qu'une invalidation ne révèle des 500 partout. Rien ne vérifiait que
        # le site répondait après un déploiement.
        # Ce smoke test force un rendu à FROID (cache-buster ?ci=) sur le
        # domaine public ET sur le worker direct, et échoue la CI si une page
        # renvoie autre chose que 200 ou contient `__next_error__`.
        run: |
          set -u
          fail=0
          check() {
            url="$1"; label="$2"; code="000"
            for attempt in 1 2 3; do
              code=$(curl -sS -o /tmp/smoke.html -w "%{http_code}" --max-time 45 "$url" || echo 000)
              if [ "$code" = "200" ] && ! grep -q "__next_error__" /tmp/smoke.html; then
                echo "✅ $label → 200"
                return 0
              fi
              echo "⚠️  $label → HTTP $code (tentative $attempt/3)"
              sleep 12
            done
            echo "❌ $label KO (HTTP $code)"
            head -c 300 /tmp/smoke.html 2>/dev/null || true
            echo
            return 1
          }
          for path in /fr /ar /fr/ressources /fr/matieres; do
            check "https://examanet.com${path}?ci=${GITHUB_RUN_ID}" "examanet.com${path}" || fail=1
            check "https://examanet-prod.examanet-poc.workers.dev${path}?ci=${GITHUB_RUN_ID}" "worker${path}" || fail=1
          done
          health=$(curl -sS --max-time 30 "https://examanet.com/api/health" || echo "")
          echo "health: ${health:0:140}"
          echo "$health" | grep -q '"ok":true' || { echo "❌ /api/health KO"; fail=1; }
          if [ "$fail" != "0" ]; then
            echo "::error::Site en erreur après déploiement (voir ci-dessus)."
            exit 1
          fi
          echo "✅ Smoke test prod OK"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-next-bundle-${{ github.run_id }}
          path: .open-next/
          retention-days: 1
