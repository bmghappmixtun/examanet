name: Build & Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - feature/d1-migration-phase1
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build + Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate

      - name: Build Next.js
        run: npx next build --no-lint 2>&1 | tail -10

      - name: Build OpenNext bundle
        run: npx opennextjs-cloudflare build --skipNextBuild 2>&1 | tail -10

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        run: |
          # Point wrangler to the correct worker entry point
          sed 's|"main": "worker-with-cache.js"|"main": ".open-next/worker.js"|' \
            wrangler.prod.jsonc > wrangler.github.jsonc
          npx wrangler deploy --config wrangler.github.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-next-bundle-${{ github.run_id }}
          path: .open-next/
          retention-days: 1
