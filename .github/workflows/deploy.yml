name: Build & Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - feature/d1-migration-phase1
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build + Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate

      - name: Build Next.js
        run: npx next build --no-lint 2>&1 | tail -10

      - name: Build OpenNext bundle
        run: npx opennextjs-cloudflare build --skipNextBuild 2>&1 | tail -10

      - name: Validate sitemap config
        # Sanity check: confirm sitemap-related files exist and have consistent structure
        run: |
          set -e
          echo "=== Checking sitemap files exist ==="
          for f in src/lib/sitemap-helpers.ts \
                   src/lib/build-resources-sitemap.ts \
                   src/app/sitemap.xml/route.ts \
                   src/app/sitemap-static.xml/route.ts \
                   src/app/sitemap-classes.xml/route.ts \
                   src/app/sitemap-subjects.xml/route.ts \
                   src/app/sitemap-teachers.xml/route.ts \
                   src/app/sitemap-resources-1.xml/route.ts \
                   src/app/sitemap-resources-2.xml/route.ts \
                   src/app/sitemap-resources-3.xml/route.ts; do
            if [ ! -f "$f" ]; then
              echo "❌ MISSING: $f"
              exit 1
            fi
          done
          echo "✅ All 10 sitemap files present"

          # Check that all route.ts files use sitemapCacheHeaders
          echo ""
          echo "=== Checking cache headers ==="
          for f in src/app/sitemap*.xml/route.ts src/app/sitemap.xml/route.ts; do
            if ! grep -q "sitemapCacheHeaders" "$f"; then
              echo "❌ $f doesn't use sitemapCacheHeaders"
              exit 1
            fi
          done
          echo "✅ All 9 sitemaps use sitemapCacheHeaders (with stale-while-revalidate)"

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        run: |
          # Point wrangler to the correct worker entry point
          sed 's|"main": "worker-with-cache.js"|"main": ".open-next/worker.js"|' \
            wrangler.prod.jsonc > wrangler.github.jsonc
          npx wrangler deploy --config wrangler.github.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-next-bundle-${{ github.run_id }}
          path: .open-next/
          retention-days: 1
