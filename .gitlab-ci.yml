# GitLab CI/CD for Examanet Cloudflare Workers
#
# Optimized with researched best practices (2026-09-11):
# - FF_USE_FASTZIP + fastest compression
# - GIT_CLEAN_FLAGS preserves node_modules between jobs
# - Direct bun run build (avoid OpenNext's swallowed stderr)
# - Retry on transient failures
#
# Required GitLab CI variables:
#   CF_ACCOUNT_ID, CF_API_TOKEN, DATABASE_URL

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/d1-migration-phase1"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: always

stages:
  - install
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  DATABASE_URL: "postgresql://stub:stub@localhost:5432/stub"
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fastest"
  CACHE_COMPRESSION_LEVEL: "fastest"
  CACHE_COMPRESSION_FORMAT: "zipzstd"
  TRANSFER_METER_FREQUENCY: "2s"
  GIT_CLEAN_FLAGS: "-ffdx -e node_modules/ -e .next/ -e .open-next/"

default:
  image: node:22-bookworm
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl unzip git > /dev/null
    - which bun || (curl -fsSL https://bun.sh/install | bash)
    - export PATH="$HOME/.bun/bin:/usr/local/bin:$PATH"

# ---------------------------------------------------------------------------
# Stage 1: install
# ---------------------------------------------------------------------------
install_dependencies:
  tags:
    - gitlab-org
  stage: install
  script:
    - echo "Installing dependencies with npm"
    - npm install --prefer-offline --no-audit --no-fund
    - 'echo "node_modules size: $(du -sh node_modules | cut -f1)"'
  cache:
    key:
      files:
        - package.json
        - package-lock.json
    paths:
      - node_modules/
    policy: push
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ---------------------------------------------------------------------------
# Stage 2: build (direct bun run build to see real errors)
# ---------------------------------------------------------------------------
build_cf_bundle:
  tags:
    - gitlab-org
  stage: build
  needs:
    - install_dependencies
  script:
    - 'echo "node_modules preserved: $(du -sh node_modules | cut -f1)"'
    - echo "Running Next.js build directly (bypass OpenNext's stderr swallow)"
    - prisma generate 2>&1
    - bash scripts/ensure-search.sh 2>&1
    - next build 2>&1 | tee /tmp/next-build.log
    - echo "Generating OpenNext bundle"
    - npx opennextjs-cloudflare build 2>&1 | tee /tmp/opennext-build.log
    - 'echo "Build complete - bundle size:"'
    - du -sh .open-next/ 2>&1
  cache:
    key:
      files:
        - package.json
        - package-lock.json
    paths:
      - node_modules/
    policy: pull
  artifacts:
    paths:
      - .open-next/
    expire_in: 1 hour
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ---------------------------------------------------------------------------
# Stage 3: deploy
# ---------------------------------------------------------------------------
deploy_production:
  tags:
    - gitlab-org
  stage: deploy
  needs:
    - build_cf_bundle
  script:
    - echo "Deploying to production"
    - export PATH="$HOME/.bun/bin:/usr/local/bin:$PATH"
    - npx wrangler deploy --config wrangler.prod.jsonc
  environment:
    name: production
    url: https://examanet.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "feature/d1-migration-phase1"'
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
