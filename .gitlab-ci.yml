# GitLab CI/CD for Examanet Cloudflare Workers
# 
# This pipeline builds and deploys the OpenNext CF Worker bundle to Cloudflare.
# Triggered on push to main (CF production) and feature/d1-migration-phase1 (CF staging).
# 
# Required GitLab CI variables (Project → Settings → CI/CD → Variables):
#   - CF_ACCOUNT_ID: 59cffdeaadf3809cc3d2039c43f836e0
#   - CF_API_TOKEN: Cloudflare API token (with Workers:Edit permission)
#   - DATABASE_URL: Neon Postgres URL (for build-time schema generation)
# 
# Worker mapping:
#   - main → examanet-prod (live, will receive examanet.com DNS)
#   - feature/d1-migration-phase1 → examanet-poc (test/canary)

stages:
  - install
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  BUN_VERSION: "1.1.0"
  # Stub DATABASE_URL during build (we use Hyperdrive at runtime, not this)
  DATABASE_URL: "postgresql://stub:stub@localhost:5432/stub"

# Use a single shared runner config to avoid duplicating setup across jobs
.default_runner:
  tags:
    - linux  # Use a Linux runner with bun installed (or install it)
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl unzip > /dev/null
    - "command -v bun || curl -fsSL https://bun.sh/install | bash"
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version
    - node --version

# Cache node_modules + .next + .open-next between jobs
.cache_template: &cache_template
  key:
    files:
      - package.json
      - bun.lock
      - wrangler.jsonc
      - wrangler.prod.jsonc
  paths:
    - node_modules/
    - .next/
    - .open-next/
  policy: pull-push

# ---------------------------------------------------------------------------
# Stage 1: install
# ---------------------------------------------------------------------------
install_dependencies:
  stage: install
  extends: .default_runner
  script:
    - echo "→ Installing dependencies with bun"
    - bun install --frozen-lockfile
    - echo "→ Restoring node_modules from bun to npm (for some scripts)"
    - npm install --prefer-offline --no-audit --no-fund
  cache:
    <<: *cache_template
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# ---------------------------------------------------------------------------
# Stage 2: build
# ---------------------------------------------------------------------------
build_cf_bundle:
  stage: build
  extends: .default_runner
  needs: [install_dependencies]
  script:
    - echo "→ Selecting wrangler config based on branch"
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        export WRANGLER_CONFIG="wrangler.prod.jsonc"
        export WORKER_NAME="examanet-prod"
      else
        export WRANGLER_CONFIG="wrangler.jsonc"
        export WORKER_NAME="examanet-poc"
      fi
    - echo "→ Worker: $WORKER_NAME (config: $WRANGLER_CONFIG)"
    - echo "→ Applying CF bundle surgery (stub sharp + nodejs-only)"
    - bash scripts/surgery-cf.sh
    - echo "→ Running npx next build"
    - rm -rf .next .open-next
    - npx next build
    - echo "→ Running opennextjs-cloudflare build"
    - npx opennextjs-cloudflare build --skipNextBuild
    - echo "→ Stubbing Prisma native binary in bundle (saves 16MB)"
    - bash scripts/stub-prisma-binary.sh
    - echo "→ Verifying bundle size"
    - du -sh .open-next/
  cache:
    <<: *cache_template
  artifacts:
    paths:
      - .open-next/
    expire_in: 1 hour

# ---------------------------------------------------------------------------
# Stage 3: deploy
# ---------------------------------------------------------------------------
deploy_to_cloudflare:
  stage: deploy
  extends: .default_runner
  needs: [build_cf_bundle]
  script:
    - echo "→ Deploying to Cloudflare Worker"
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        export WRANGLER_CONFIG="wrangler.prod.jsonc"
        export WORKER_NAME="examanet-prod"
      else
        export WRANGLER_CONFIG="wrangler.jsonc"
        export WORKER_NAME="examanet-poc"
      fi
    - echo "→ Target: $WORKER_NAME"
    - CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE="postgresql://stub:stub@localhost:5432/stub" \
      CLOUDFLARE_ACCOUNT_ID="${CF_ACCOUNT_ID}" \
      CLOUDFLARE_API_TOKEN="${CF_API_TOKEN}" \
      npx wrangler deploy --config "$WRANGLER_CONFIG"
  environment:
    name: production
    url: https://examanet-prod.examanet-poc.workers.dev
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
      when: on_success
      allow_failure: false
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  cache:
    <<: *cache_template
    policy: pull

# Staging deploy (always to POC, never to prod)
deploy_to_poc:
  stage: deploy
  extends: .default_runner
  needs: [build_cf_bundle]
  script:
    - echo "→ Deploying to CF staging (examanet-poc)"
    - CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE="postgresql://stub:stub@localhost:5432/stub" \
      CLOUDFLARE_ACCOUNT_ID="${CF_ACCOUNT_ID}" \
      CLOUDFLARE_API_TOKEN="${CF_API_TOKEN}" \
      npx wrangler deploy --config wrangler.jsonc
  environment:
    name: staging
    url: https://examanet-poc.examanet-poc.workers.dev
  rules:
    - if: $CI_COMMIT_REF_NAME != "main"
      when: on_success
      allow_failure: true  # Don't fail pipeline if POC deploy fails
  cache:
    <<: *cache_template
    policy: pull
