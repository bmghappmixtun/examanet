# GitLab CI/CD for Examanet Cloudflare Workers
#
# 2026-08-26: Pipeline disabled (workflow: never) because GitLab.com Trial
#   has no shared runner. Uncomment workflow: rules below to re-enable
#   once a runner is added, or trigger manually from GitLab UI.
#
# 2026-09-08: RE-ENABLED. workflow: rules now auto-triggers on push to
#   feature/d1-migration-phase1 (and main). Requires a runner to be
#   configured in Settings → CI/CD → Runners.
#
# Required GitLab CI variables (set on project, masked+protected):
#   CF_ACCOUNT_ID  - Cloudflare account ID
#   CF_API_TOKEN   - Cloudflare API token (Workers:Edit)
#   DATABASE_URL   - stub is fine, D1 used at runtime

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/d1-migration-phase1"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: always

stages:
  - install
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  DATABASE_URL: "postgresql://stub:stub@localhost:5432/stub"

# Default image and setup
default:
  image: node:22-bullseye
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl unzip git > /dev/null
    - which bun || (curl -fsSL https://bun.sh/install | bash)
    - export PATH="$HOME/.bun/bin:/usr/local/bin:$PATH"
    - bun --version
    - node --version

# ---------------------------------------------------------------------------
# Stage 1: install
# ---------------------------------------------------------------------------
install_dependencies:
  stage: install
  script:
    - echo "Installing dependencies with bun"
    - bun install --frozen-lockfile
    - echo "Fallback npm install for postinstall scripts"
    - npm install --prefer-offline --no-audit --no-fund
  cache:
    key:
      files:
        - package.json
        - bun.lock
    paths:
      - node_modules/
      - .next/
      - .open-next/
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# ---------------------------------------------------------------------------
# Stage 2: build
# ---------------------------------------------------------------------------
build_cf_bundle:
  stage: build
  needs: ["install_dependencies"]
  script:
    - echo "Running CF bundle surgery"
    - bash scripts/surgery-cf.sh
    - echo "Running npx next build"
    - rm -rf .next .open-next
    - npx next build
    - echo "Running opennextjs-cloudflare build"
    - npx opennextjs-cloudflare build --skipNextBuild
    - echo "Stubbing Prisma native binary"
    - bash scripts/stub-prisma-binary.sh
    - echo "Bundle size"
    - du -sh .open-next/
  cache:
    key:
      files:
        - package.json
        - bun.lock
    paths:
      - node_modules/
      - .next/
      - .open-next/
    policy: pull
  artifacts:
    paths:
      - .open-next/
    expire_in: 1 hour

# ---------------------------------------------------------------------------
# Stage 3a: deploy to PRODUCTION (main + feature/d1-migration-phase1)
# 2026-09-08: feature/d1-migration-phase1 is currently the PROD branch
# (DNS swap was done on it, examanet.com points to its deploys).
# Add "main" once the repo gets a proper main branch with this content.
# ---------------------------------------------------------------------------
deploy_production:
  stage: deploy
  needs: ["build_cf_bundle"]
  script:
    - echo "Deploying to examanet-prod"
    - export CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE="postgresql://stub:stub@localhost:5432/stub"
    - export CLOUDFLARE_ACCOUNT_ID="${CF_ACCOUNT_ID}"
    - export CLOUDFLARE_API_TOKEN="${CF_API_TOKEN}"
    - npx wrangler deploy --config wrangler.prod.jsonc
  environment:
    name: production
    url: https://examanet-prod.examanet-poc.workers.dev
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
      when: on_success
    - if: $CI_COMMIT_REF_NAME == "feature/d1-migration-phase1"
      when: on_success
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  cache:
    key:
      files:
        - package.json
        - bun.lock
    paths:
      - node_modules/
      - .next/
      - .open-next/
    policy: pull

# ---------------------------------------------------------------------------
# Stage 3b: deploy to STAGING (POC, all other branches)
# ---------------------------------------------------------------------------
deploy_staging:
  stage: deploy
  needs: ["build_cf_bundle"]
  script:
    - echo "Deploying to examanet-poc"
    - export CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE="postgresql://stub:stub@localhost:5432/stub"
    - export CLOUDFLARE_ACCOUNT_ID="${CF_ACCOUNT_ID}"
    - export CLOUDFLARE_API_TOKEN="${CF_API_TOKEN}"
    - npx wrangler deploy --config wrangler.jsonc
  environment:
    name: staging
    url: https://examanet-poc.examanet-poc.workers.dev
  rules:
    - if: $CI_COMMIT_REF_NAME != "main"
      when: on_success
      allow_failure: true
  cache:
    key:
      files:
        - package.json
        - bun.lock
    paths:
      - node_modules/
      - .next/
      - .open-next/
    policy: pull
