# GitLab CI/CD for Examanet Cloudflare Workers
#
# 2026-09-11: Combined install + build into a single job to avoid
#   the slow node_modules transfer between jobs (GitLab cache = 8min
#   tar upload, artifacts = same). With combined job, npm install
#   runs once with --prefer-offline (~30s incremental).
#
# Required GitLab CI variables (set on project, masked+protected):
#   CF_ACCOUNT_ID  - Cloudflare account ID
#   CF_API_TOKEN   - Cloudflare API token (Workers:Edit)
#   DATABASE_URL   - stub is fine, D1 used at runtime

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/d1-migration-phase1"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: always

stages:
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  DATABASE_URL: "postgresql://stub:stub@localhost:5432/stub"
  FF_USE_FASTZIP: "true"

# Default setup
default:
  image: node:22-bookworm
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl unzip git > /dev/null
    - which bun || (curl -fsSL https://bun.sh/install | bash)
    - export PATH="$HOME/.bun/bin:/usr/local/bin:$PATH"
    - bun --version
    - node --version

# ---------------------------------------------------------------------------
# Stage 1: install + build (combined to avoid node_modules transfer)
# ---------------------------------------------------------------------------
build_cf_bundle:
  tags:
    - gitlab-org
  stage: build
  script:
    - echo "Installing dependencies with npm"
    - npm install --prefer-offline --no-audit --no-fund
    - echo "Building OpenNext bundle for Cloudflare Workers"
    - npx opennextjs-cloudflare build
    - echo "Build complete"
    - ls -la .open-next/ 2>&1 | head -10
  artifacts:
    paths:
      - .open-next/
    expire_in: 1 hour
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ---------------------------------------------------------------------------
# Stage 2: deploy (production only on main)
# ---------------------------------------------------------------------------
deploy_production:
  tags:
    - gitlab-org
  stage: deploy
  needs:
    - build_cf_bundle
  script:
    - echo "Deploying to production"
    - export PATH="$HOME/.bun/bin:/usr/local/bin:$PATH"
    - npx wrangler deploy --config wrangler.prod.jsonc
  environment:
    name: production
    url: https://examanet.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "feature/d1-migration-phase1"'
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
